name: MAGI CI/CD Pipeline (ARM64 -> Harbor -> ArgoCD)

on:
  push:
    branches:
      - main
      - feature/monorepo-migration
    tags:
      - "v*.*.*"
    paths-ignore:
      - "deploy/k8s/overlays/*/kustomization.yaml"
      - "docs/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Entorno objetivo a desplegar"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - prod
      image_tag:
        description: "Tag de imagen opcional (ej. v0.2.0); vacío usa git sha"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  HARBOR_REGISTRY: harbor.airesresearch.com
  HARBOR_PROJECT: magi

jobs:
  quality-gates:
    name: Quality Gates (Go + Next.js + Kustomize)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Go vet & unit tests (-race)
        working-directory: apps/server
        run: |
          go vet ./...
          go test -race ./...

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies & run checks
        run: |
          bun install --frozen-lockfile
          cd apps/web
          bun run check-types
          bun run test

      - name: Validate Kustomize manifests
        run: |
          kubectl kustomize deploy/k8s/overlays/qa > /dev/null
          kubectl kustomize deploy/k8s/overlays/prod > /dev/null

  build-and-push:
    name: Build & Push ARM64 Images to Harbor
    needs: quality-gates
    runs-on: [self-hosted, linux, arm64]
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      target_env: ${{ steps.meta.outputs.target_env }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute & validate image tag & target environment
        id: meta
        shell: bash
        env:
          INPUT_TARGET_ENV: ${{ inputs.target_env }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_FULL: ${{ github.ref }}
          SHA_SHORT: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA_SHORT:0:7}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ENV_TARGET="$INPUT_TARGET_ENV"
            TAG="${INPUT_IMAGE_TAG:-${ENV_TARGET}-${SHORT_SHA}}"
          elif [[ "$REF_FULL" == refs/tags/v* ]]; then
            ENV_TARGET="prod"
            TAG="${REF_FULL#refs/tags/}"
          else
            ENV_TARGET="qa"
            TAG="qa-${SHORT_SHA}"
          fi

          if [[ "$ENV_TARGET" != "qa" && "$ENV_TARGET" != "prod" ]]; then
            echo "ERROR: target_env inválido: $ENV_TARGET" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9._-]{1,64}$ ]]; then
            echo "ERROR: image_tag inválido: $TAG" >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "target_env=${ENV_TARGET}" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & Push magi/server (linux/arm64)
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          TARGET_ENV: ${{ steps.meta.outputs.target_env }}
        run: |
          docker build --platform linux/arm64 \
            -t "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/server:${IMAGE_TAG}" \
            -t "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/server:${TARGET_ENV}" \
            ./apps/server
          docker push "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/server:${IMAGE_TAG}"
          docker push "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/server:${TARGET_ENV}"

      - name: Build & Push magi/web (linux/arm64)
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          TARGET_ENV: ${{ steps.meta.outputs.target_env }}
        run: |
          if [[ "$TARGET_ENV" == "prod" ]]; then
            API_URL="https://api.airesresearch.com"
          else
            API_URL="https://api-qa.airesresearch.com"
          fi
          docker build --platform linux/arm64 \
            -f apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_URL=${API_URL}" \
            -t "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/web:${IMAGE_TAG}" \
            -t "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/web:${TARGET_ENV}" \
            .
          docker push "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/web:${IMAGE_TAG}"
          docker push "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/web:${TARGET_ENV}"

  gitops-promote:
    name: Update Kustomize Tag for ArgoCD
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && 'feature/monorepo-migration' || github.ref_name }}

      - name: Update Kustomize overlay image tags
        env:
          TARGET_ENV: ${{ needs.build-and-push.outputs.target_env }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
          TARGET_BRANCH: ${{ github.ref_type == 'tag' && 'feature/monorepo-migration' || github.ref_name }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9._-]{1,64}$ ]]; then
            echo "ERROR: IMAGE_TAG inválido" >&2
            exit 1
          fi
          OVERLAY_FILE="deploy/k8s/overlays/${TARGET_ENV}/kustomization.yaml"
          sed -i -E "s|(newTag:[[:space:]]*).*|\1${IMAGE_TAG}|g" "$OVERLAY_FILE"
          git config user.name "magi-gitops-bot"
          git config user.email "gitops-bot@airesresearch.com"
          if ! git diff --quiet "$OVERLAY_FILE"; then
            git add "$OVERLAY_FILE"
            git commit -m "chore(gitops): promote ${TARGET_ENV} images to ${IMAGE_TAG} [skip ci]"
            git push origin "HEAD:${TARGET_BRANCH}"
          else
            echo "No changes to ${OVERLAY_FILE}"
          fi
