services:
  # =============================================================================
  # Microservicio de Consultas HTTP (CQRS Read Path)
  # =============================================================================
  magi-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    container_name: magi-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - DATABASE_DSN=${DOCKER_DATABASE_DSN:-host=postgres user=magi password=secret dbname=magi port=5432 sslmode=disable}
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - magi-network

  # =============================================================================
  # Microservicio Ingestor de Kafka (CQRS Write Path)
  # =============================================================================
  magi-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    container_name: magi-worker
    restart: unless-stopped
    environment:
      - DATABASE_DSN=${DOCKER_DATABASE_DSN:-host=postgres user=magi password=secret dbname=magi port=5432 sslmode=disable}
      - KAFKA_BROKERS=${DOCKER_KAFKA_BROKERS:-kafka:9092}
      - KAFKA_STATIC_TOPIC=${KAFKA_STATIC_TOPIC:-ais.static}
      - KAFKA_DYNAMIC_TOPIC=${KAFKA_DYNAMIC_TOPIC:-ais.dynamic}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID:-magi-consumer-group}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - magi-network

  # =============================================================================
  # Base de Datos Relacional: PostgreSQL 16
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: magi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-magi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-magi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magi} -d ${POSTGRES_DB:-magi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - magi-network

  # =============================================================================
  # Broker de Eventos: Apache Kafka (KRaft Mode sin Zookeeper)
  # =============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: magi-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - magi-network

volumes:
  postgres_data:
    name: magi_postgres_data

networks:
  magi-network:
    name: magi_network
