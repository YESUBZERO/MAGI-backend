apiVersion: apps/v1
kind: Deployment
metadata:
  name: magi-worker
  labels:
    app.kubernetes.io/name: magi-worker
    app.kubernetes.io/part-of: aires-magi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: magi-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magi-worker
        app.kubernetes.io/part-of: aires-magi
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-pull-secret
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              until nc -z magi-postgres 5432; do echo "Waiting for magi-postgres..."; sleep 2; done
              until nc -z magi-kafka 9092; do echo "Waiting for magi-kafka..."; sleep 3; done
      containers:
        - name: magi-worker
          image: harbor.airesresearch.com/magi/server:latest
          imagePullPolicy: Always
          args: ["worker"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: magi-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
