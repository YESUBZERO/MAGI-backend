apiVersion: v1
kind: Service
metadata:
  name: magi-redis
  labels:
    app.kubernetes.io/name: magi-redis
    app.kubernetes.io/part-of: aires-magi
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: magi-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magi-redis
  labels:
    app.kubernetes.io/name: magi-redis
    app.kubernetes.io/part-of: aires-magi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: magi-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magi-redis
        app.kubernetes.io/part-of: aires-magi
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
