apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: magi-api-monitor
  labels:
    app.kubernetes.io/name: magi-api
    app.kubernetes.io/part-of: aires-magi
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: magi-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
