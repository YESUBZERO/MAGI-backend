apiVersion: v1
kind: Service
metadata:
  name: magi-api
  labels:
    app.kubernetes.io/name: magi-api
    app.kubernetes.io/part-of: aires-magi
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: magi-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magi-api
  labels:
    app.kubernetes.io/name: magi-api
    app.kubernetes.io/part-of: aires-magi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: magi-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magi-api
        app.kubernetes.io/part-of: aires-magi
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-pull-secret
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - until nc -z magi-postgres 5432; do echo "Waiting for magi-postgres..."; sleep 2; done
        - name: init-exports-dir
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          command:
            - sh
            - -c
            - mkdir -p /var/magi/exports && chown -R 10001:10001 /var/magi/exports && chmod 0750 /var/magi/exports
          volumeMounts:
            - name: exports-storage
              mountPath: /var/magi/exports
      containers:
        - name: magi-api
          image: harbor.airesresearch.com/magi/server:latest
          imagePullPolicy: Always
          args: ["api"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: magi-secrets
          volumeMounts:
            - name: exports-storage
              mountPath: /var/magi/exports
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: exports-storage
          persistentVolumeClaim:
            claimName: magi-exports-pvc
