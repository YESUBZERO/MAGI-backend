apiVersion: v1
kind: Service
metadata:
  name: magi-web
  labels:
    app.kubernetes.io/name: magi-web
    app.kubernetes.io/part-of: aires-magi
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: magi-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magi-web
  labels:
    app.kubernetes.io/name: magi-web
    app.kubernetes.io/part-of: aires-magi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: magi-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magi-web
        app.kubernetes.io/part-of: aires-magi
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: magi-web
          image: harbor.airesresearch.com/magi/web:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: magi-web-secrets
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
