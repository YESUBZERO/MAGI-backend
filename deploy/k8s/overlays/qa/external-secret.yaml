apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: magi-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-qa
    kind: ClusterSecretStore
  target:
    name: magi-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: magi/qa/app
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: magi-web-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-qa
    kind: ClusterSecretStore
  target:
    name: magi-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: NEXT_PUBLIC_API_URL
      remoteRef:
        key: magi/qa/app
        property: NEXT_PUBLIC_API_URL
    - secretKey: NEXTAUTH_URL
      remoteRef:
        key: magi/qa/app
        property: NEXTAUTH_URL
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: magi/qa/app
        property: NEXTAUTH_SECRET
    - secretKey: ZITADEL_ISSUER
      remoteRef:
        key: magi/qa/app
        property: ZITADEL_ISSUER
    - secretKey: ZITADEL_CLIENT_ID
      remoteRef:
        key: magi/qa/app
        property: ZITADEL_CLIENT_ID
    - secretKey: ZITADEL_CLIENT_SECRET
      remoteRef:
        key: magi/qa/app
        property: ZITADEL_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-pull-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-qa
    kind: ClusterSecretStore
  target:
    name: harbor-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .DOCKER_CONFIG_JSON }}"
  data:
    - secretKey: DOCKER_CONFIG_JSON
      remoteRef:
        key: magi/ci/harbor-pull
        property: DOCKER_CONFIG_JSON
