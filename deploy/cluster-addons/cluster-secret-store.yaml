apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao-qa
spec:
  conditions:
    - namespaces:
        - magi-qa
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-qa-role"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
---
